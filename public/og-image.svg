<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Dark Obsidian Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1017" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>

    <!-- Indigo/Sky Brand Glow -->
    <radialGradient id="glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0E1017" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="skyGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0E1017" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="brandText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151824" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#skyGlow)" />

  <!-- Outer Border -->
  <rect x="2" y="2" width="1196" height="626" rx="20" fill="none" stroke="#262A38" stroke-width="2" />

  <!-- Top Badge -->
  <g transform="translate(100, 90)">
    <rect width="360" height="38" rx="19" fill="#1A1D2B" stroke="#3730A3" stroke-width="1.5" />
    <circle cx="24" cy="19" r="6" fill="#34D399" />
    <text x="42" y="24" fill="#C7D2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">
      REAL-TIME A11Y &amp; UX DIAGNOSTICS
    </text>
  </g>

  <!-- Logo & Title -->
  <g transform="translate(100, 160)">
    <!-- App Icon -->
    <rect width="72" height="72" rx="18" fill="#090A0F" stroke="#27272A" stroke-width="2" />
    <g transform="translate(12, 12) scale(2)" fill="none" stroke="#F4F4F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7V5a2 2 0 0 1 2-2h2" />
      <path d="M17 3h2a2 2 0 0 1 2 2v2" />
      <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
      <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
      <path d="M18.944 12.33a1 1 0 0 0 0-.66 7.5 7.5 0 0 0-13.888 0 1 1 0 0 0 0 .66 7.5 7.5 0 0 0 13.888 0" />
      <circle cx="12" cy="12" r="1" fill="#F4F4F5" stroke="#F4F4F5" />
    </g>

    <!-- Brand Name -->
    <text x="94" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" letter-spacing="-1">
      AccessiVision
    </text>
    <rect x="420" y="24" width="76" height="28" rx="8" fill="#27272A" />
    <text x="432" y="43" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">
      STUDIO
    </text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="310" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
    Diagnose, Visualize &amp; <tspan fill="url(#brandText)">Remediate</tspan>
  </text>
  <text x="100" y="370" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
    Web Accessibility in Real Time.
  </text>

  <!-- Subtitle -->
  <text x="100" y="430" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
    Automated WCAG 2.1 checks • Keyboard tab flow • APCA contrast • 7 vision deficiency modes
  </text>

  <!-- Bottom Pills -->
  <g transform="translate(100, 490)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="44" rx="12" fill="url(#cardGrad)" stroke="#27272A" />
      <text x="20" y="27" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">
        ⌨️ Keyboard Flow Map
      </text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(225, 0)">
      <rect width="220" height="44" rx="12" fill="url(#cardGrad)" stroke="#27272A" />
      <text x="20" y="27" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">
        👁️ Vision Deficiencies
      </text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(460, 0)">
      <rect width="220" height="44" rx="12" fill="url(#cardGrad)" stroke="#27272A" />
      <text x="20" y="27" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">
        🎨 APCA &amp; WCAG AA
      </text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(695, 0)">
      <rect width="260" height="44" rx="12" fill="url(#cardGrad)" stroke="#27272A" />
      <text x="20" y="27" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">
        ⚡ 100% Client-Side Privacy
      </text>
    </g>
  </g>
</svg>
